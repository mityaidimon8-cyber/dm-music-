
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DM Muzic</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="logo">DM <span>MUZIC</span></div>
    <p>Твоя музыка. Твой вайб.</p>
  </header>

  <main>
    <input id="search" type="search" placeholder="Найти песню или исполнителя">
    <button id="searchBtn">Найти</button>
    <section id="results">
      <p>Ищи музыку и создавай свою коллекцию</p>
    </section>
  </main>

  <nav>
    <button data-tab="music">Моя музыка</button>
    <button data-tab="search">Поиск</button>
    <button data-tab="playlists">Плейлисты</button>
    <button data-tab="settings">Настройки</button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
